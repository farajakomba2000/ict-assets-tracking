<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #0056b3 !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 8px; }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-lg">
        <span class="navbar-brand">ICT Assets Tracking</span>
        <div class="ms-auto">
            <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container-lg mt-4">
    <div class="card">
        <div class="card-header">
            <h5 th:if="${username}" class="mb-0">Edit User</h5>
            <h5 th:unless="${username}" class="mb-0">Create User</h5>
        </div>
        <div class="card-body">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:if="${username}" th:action="@{/users/{id}(id=${id})}" th:object="${update}" method="post">
                <div class="mb-3">
                    <label class="form-label" th:text="${displayUsernameLabel != null ? displayUsernameLabel : 'Username'}">Username</label>
                    <input type="text" class="form-control" th:value="${username}" readonly />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">New Password (leave blank to keep)</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" />
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}" />
                    <label class="form-check-label" for="enabled">Enabled</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Roles</label>
                    <div th:each="role : ${roles}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{roles}" th:id="${role}" th:value="${role}" />
                            <label class="form-check-label" th:for="${role}" th:text="${role}"></label>
                        </div>
                    </div>
                    <a th:href="@{/users/{id}/roles/add(id=${id})}" class="btn btn-sm btn-outline-primary mt-2">+ Add Role</a>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/users" class="btn btn-secondary ms-2">Cancel</a>
            </form>

            <form th:unless="${username}" th:action="@{/users}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username (Check Number)</label>
                    <input type="number" id="username" th:field="*{username}" class="form-control"
                           inputmode="numeric" min="0" step="1" pattern="[0-9]*" required />
                    <input type="hidden" th:field="*{checkNumber}" id="checkNumber" />
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}" class="form-control" />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="middleName" class="form-label">Middle Name</label>
                        <input type="text" id="middleName" th:field="*{middleName}" class="form-control" />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}" class="form-control" />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="workstationName" class="form-label">Workstation Name</label>
                        <select id="workstationName" th:field="*{workstationName}" class="form-control">
                            <option value="">-- Select Workstation --</option>
                            <option th:each="name : ${workstationNames}" th:value="${name}" th:text="${name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="departmentName" class="form-label">Department Name</label>
                        <select id="departmentName" th:field="*{departmentName}" class="form-control">
                            <option value="">-- Select Department --</option>
                            <option th:each="name : ${departmentNames}" th:value="${name}" th:text="${name}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="sectionName" class="form-label">Section Name</label>
                        <select id="sectionName" th:field="*{sectionName}" class="form-control">
                            <option value="">-- Select Section --</option>
                            <option th:each="name : ${sectionNames}" th:value="${name}" th:text="${name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="organizationName" class="form-label">Organization Name</label>
                        <input type="text" id="organizationName" th:field="*{organizationName}" class="form-control" readonly />
                        <input type="hidden" th:field="*{organizationCode}" />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Roles</label>
                    <div th:each="role : ${roles}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{roles}" th:id="${role}" th:value="${role}" />
                            <label class="form-check-label" th:for="${role}" th:text="${role}"></label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Create</button>
                <a href="/users" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const usernameInput = document.getElementById('username');
    const checkNumberInput = document.getElementById('checkNumber');

    if (usernameInput && checkNumberInput) {
        usernameInput.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
            checkNumberInput.value = this.value;
        });
    }
</script>
</body>
</html>
